<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel workouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="Carousel" class="Carousel slide" data-bs-ride="Carousel">
        <div class="Carousel-inner">

            <div class="Carousel-item">
                <img src="/PO.jpg"  class="d-block w-80 h-50">
            </div>

            <div class="Carousel-item active">
                <img src="/ajith.jpg" class="d-block w-80 h-50">
            </div>

        </div>
        <button class="Carousel-control-prev" data-bs-target="#mycarousel" data-bs-slide="prev">
            prev
        </button>
        <button class="Carousel-control-next" data-bs-target="#mycarousel" data-bs-slide="next">
            next
        </button>
    </div>

    <div class="js-config">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>

    

    
</body>
</html>
