<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</head>
<body>
    <div class="text-success text-center h1">Responsive Grid</div>

    <div class="container">
        <div class="row mt-5">
            <div class="col-sm-12 col-md-6 col-lg-3 border border-primary">content-1</div>
            <div class="col-sm-12 col-md-6 col-lg-3 border border-primary">content-2</div>
            <div class="col-sm-12 col-md-6 col-lg-3 border border-primary text-center">content-3</div>
            <div class="col-sm-12 col-md-6 col-lg-3 border border-primary text-end">content-4</div>
            <div class="col-sm-12 col-md-6 col-lg-3 border border-primary text-center bg-success">content-5</div>
            
        </div>
    </div>
    
</body>
</html>
