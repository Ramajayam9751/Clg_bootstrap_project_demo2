<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal worouts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <div class="container-fluid">
        <button class="btn-success" data-bs-toggle="modal" data-bs-target="#blog"> show </button>
    </div>

    <div class="container-fluid">
        <div class="modal" id="blog">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">body</div>
                    <div class="modal-footer">footer</div>
                </div>
            </div>
        </div>

    </div>
    <div class="js-config">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>


    <div class="container-fluid">
        <button class="modal" data-bs-toggle="mmodal" data-bs-target="modal-content">click me</button>
    </div>

    <div class="container-fluid">
        <div class="modal" id="modal-content">
            <div class="modal-dialog">
                <div class="modal-content">content</div>
                    <div class="modal-header">header</div>
                        <div class="modal-body">
                            <button type="button" class="btn-cancel" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-footer"></div>
                
            </div>
        </div>
    </div>
    <div class="js-config">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>








    </body>
    </html>
